name: YCM Compliance Reminder Worker

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

concurrency:
  group: ycm-compliance-reminder-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install production dependencies
        run: npm ci --omit=dev
      - name: Validate worker configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        run: |
          if [ -z "$DATABASE_URL" ] && [ -z "$POSTGRES_URL" ]; then
            echo "DATABASE_URL or POSTGRES_URL secret is required"
            exit 1
          fi
      - name: Generate compliance reminders
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        run: npm run compliance:reminders
