name: YCM One CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Impact Proof contract test
        run: npm run test:impact-proof
      - name: Migration runner contract test
        run: npm run test:migration
      - name: Command Center contract test
        run: npm run test:command-center
      - name: Work control contract test
        run: npm run test:work-control
      - name: Business domain/team contract test
        run: npm run test:business-domains
      - name: Unified service master contract test
        run: npm run test:service-master
      - name: Dynamic service operating layer contract test
        run: npm run test:dynamic-service-layer
      - name: Provider workflow contract test
        run: npm run test:provider-workflow
      - name: Unified lead intake contract test
        run: npm run test:unified-lead-intake
      - name: Individual and family membership contract test
        run: npm run test:membership
      - name: Service governance UI contract test
        run: npm run test:service-governance-ui
      - name: Membership review contract test
        run: npm run test:membership-review
      - name: Financial ledger contract test
        run: npm run test:financial-ledger
      - name: Eko AePS contract test
        run: npm run test:eko-aeps
      - name: T+1 settlement contract test
        run: npm run test:settlement
      - name: Eko retailer flow contract test
        run: npm run test:eko-retailer-flow
      - name: YCM package and KYC contract test
        run: npm run test:ycm-package-kyc
      - name: AEPS provider mode contract test
        run: npm run test:aeps-provider-modes
      - name: Auth login security contract test
        run: npm run test:auth-login-security
      - name: Jan Aadhaar crypto contract test
        run: npm run test:jan-aadhaar-crypto
      - name: Jan Aadhaar integration contract test
        run: npm run test:jan-aadhaar-integration
      - name: Company financial control contract test
        run: npm run test:company-financial-control
      - name: Security primitives contract test
        run: npm run test:security-primitives
      - name: API request policy contract test
        run: npm run test:api-request-policy
      - name: Company asset control contract test
        run: npm run test:company-asset-control
      - name: Company expense approval contract test
        run: npm run test:company-expense-approval
      - name: Company finance reports contract test
        run: npm run test:company-finance-reports
      - name: Finance reconciliation contract test
        run: npm run test:finance-reconciliation
      - name: DigiLocker integration contract test
        run: npm run test:digilocker
      - name: Service geography scope contract test
        run: npm run test:service-geography-scope
      - name: Employee KPI security contract test
        run: npm run test:employee-kpi-security
      - name: Financial webhook security contract test
        run: npm run test:financial-webhook-security
      - name: AEPS webhook security contract test
        run: npm run test:aeps-webhook-security
      - name: Aggregate security contract suite
        run: npm run test:security-contracts
      - name: CRM and telemetry security contract test
        run: npm run test:crm-telemetry-security
      - name: Payout destination security contract test
        run: npm run test:payout-destination-security
      - name: Production build
        run: npm run build

# CI verification trigger: keep this workflow intentionally explicit and auditable.
