name: YCM One CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Impact Proof contract test
        run: npm run test:impact-proof
      - name: Migration runner contract test
        run: npm run test:migration
      - name: Command Center contract test
        run: npm run test:command-center
      - name: Work control contract test
        run: npm run test:work-control
      - name: Business domain/team contract test
        run: npm run test:business-domains
      - name: Unified service master contract test
        run: npm run test:service-master
      - name: Dynamic service operating layer contract test
        run: npm run test:dynamic-service-layer
      - name: Provider workflow contract test
        run: npm run test:provider-workflow
      - name: Unified lead intake contract test
        run: npm run test:unified-lead-intake
      - name: Individual and family membership contract test
        run: npm run test:membership
      - name: Service governance UI contract test
        run: npm run test:service-governance-ui
      - name: Membership review contract test
        run: npm run test:membership-review
      - name: Financial ledger contract test
        run: npm run test:financial-ledger
      - name: Eko AePS contract test
        run: npm run test:eko-aeps
      - name: T+1 settlement contract test
        run: npm run test:settlement
      - name: Eko retailer flow contract test
        run: npm run test:eko-retailer-flow
      - name: YCM package and KYC contract test
        run: npm run test:ycm-package-kyc
      - name: AEPS provider mode contract test
        run: npm run test:aeps-provider-modes
      - name: Auth login security contract test
        run: npm run test:auth-login-security
      - name: Production build
        run: npm run build
