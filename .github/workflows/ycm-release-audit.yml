name: YCM Security Release Audit (Manual Fallback)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-release-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact selected SHA
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact lockfile
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Release audit contract
        run: npm run test:release-audit

      - name: Production build
        run: npm run build

      - name: Portable Docker build
        run: docker build --pull -t ycm-one-release-audit:${{ github.sha }} .

      - name: Emit security audit manifest
        run: |
          mkdir -p audit-artifact
          cat > audit-artifact/release-audit.txt <<EOF
          YCM ONE SECURITY RELEASE AUDIT
          audited_sha=${{ github.sha }}
          security_gate=PASS
          dependency_audit=PASS
          release_contract=PASS
          production_build=PASS
          portable_docker_build=PASS
          EOF

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: ycm-security-release-audit-${{ github.sha }}
          path: audit-artifact/release-audit.txt
